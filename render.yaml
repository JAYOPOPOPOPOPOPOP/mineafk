# Render Blueprint - https://render.com/docs/blueprint-spec
# Note: Free web services sleep. Use paid for 24/7 bots.

services:
  - type: web
    name: mineafk-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install && cd packages/database && npx prisma generate && cd ../.. && cd apps/api && npx tsc || true
    startCommand: npx tsx apps/api/src/index.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: mineafk-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: mineafk-redis
          type: redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: ENABLE_OFFLINE_ACCOUNTS
        value: "true"
      - key: CORS_ORIGIN
        sync: false
      - key: WEB_URL
        sync: false

  - type: worker
    name: mineafk-worker
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install && cd packages/database && npx prisma generate
    startCommand: npx tsx apps/workers/minecraft-worker/src/index.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mineafk-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: mineafk-redis
          type: redis
          property: connectionString
      - key: WORKER_CONCURRENCY
        value: "1"

  - type: web
    name: mineafk-web
    runtime: node
    plan: free
    rootDir: apps/web
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: NEXT_PUBLIC_API_URL
        sync: false

  - type: redis
    name: mineafk-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: mineafk-db
    plan: free
    databaseName: mineafk
    user: mineafk
